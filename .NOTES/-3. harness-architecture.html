<header><p class="eyebrow">HARNESS / RUNTIME MECHANISM</p><h1>Harness 如何推进一个任务</h1><p class="intro">以工具调用型 Agent 为例：输入写入状态 → 构造请求 → 模型返回答案或行动意图 → 准入与执行 → 观察写回状态 → 下一轮。左侧是运行时，右侧展开实际能力，底部是 Base。</p></header>
